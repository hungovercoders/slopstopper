name: SlopStopper · Secrets Detection

# Detects committed secrets with Gitleaks (pinned version). Triggers:
# PR, push to main. Emits a rolling PR comment (keyed on the "Secrets
# Detection" substring so each PR shows one rolling comment, not
# duplicates) and a main-branch tracking issue on findings.
# Docs: docs/security/README.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  secrets:
    name: Detect Secrets with Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Gitleaks
        # Pinned to a specific release rather than dynamically resolving
        # the latest tag. The previous approach piped an unauthenticated
        # `curl https://api.github.com/...` to extract the tag —
        # anonymous API requests from Actions runners are heavily
        # rate-limited and frequently return empty, producing a
        # `gitleaks__linux_x64.tar.gz` URL that 404s. Bump
        # GITLEAKS_VERSION manually when a refresh is wanted;
        # Dependabot's github-actions ecosystem can also be pointed at
        # this file.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -e
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        shell: bash

      - name: Set up slopstopper toolchain
        # Installs the pinned slopstopper-cli + task from mise.toml and puts
        # them on PATH for later steps. The pin lives in mise.toml ([tools]
        # "pipx:slopstopper-cli"); mise resolves it per-repo, so CI and local
        # runs share one version.
        uses: jdx/mise-action@v2

      - name: Install slopstopper-cli from source (slopstopper.dev only)
        # In this repo the CLI runs from source (HEAD), so mise.toml carries
        # no slopstopper-cli pin — install it editable here. Adopter repos
        # skip this (no cli/ source) and use the mise-pinned wheel.
        if: ${{ hashFiles('cli/pyproject.toml') != '' }}
        run: pip install -e ./cli

      # The check itself is the gate: it exits 1 on blocking findings, so
      # this step's outcome IS the verdict. No separate detect / fail-job
      # steps, and the local `task ss:security:secrets` agrees with CI.
      - name: Run secrets detection
        id: secrets
        # `task -x` passes the CLI's exit code through (plain `task` maps
        # every failure to 201). The code is kept as an output so later
        # steps can tell findings (1) from could-not-run (2).
        shell: bash
        run: |
          set +e
          task -x ss:security:secrets
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload secrets reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-reports
          path: |
            .ss/reports/secrets/secrets-report.md
            .ss/reports/secrets/secrets-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Emit PR comment
        if: always() && github.event_name == 'pull_request' && steps.secrets.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:secrets --target pr-comment --status ${{ steps.secrets.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete

      - name: Emit issue on main (if secrets detected)
        # rc 1 only — exit 2 means the scan didn't run, which is not a finding
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.secrets.outputs.rc == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:secrets --target issue

      - name: Close issue on main when clean
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.secrets.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:secrets --target issue --on-pass=close
