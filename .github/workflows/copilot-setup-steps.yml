name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        # SAST runs semgrep via subprocess. Installed via pip to match
        # ss-security-sast-check.yml, because semgrep isn't pinned via mise anywhere.
        run: |
          pip install --upgrade pip
          pip install semgrep

      - name: Set up slopstopper toolchain
        # Installs node + task from mise.toml ([tools]) onto PATH, so both are
        # single-sourced from the pin (no curl-installed Taskfile, no hardcoded
        # Node version). The version follows the repo, same as CI and local.
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install slopstopper-cli from source
        # This repo runs the CLI from source (HEAD), so mise.toml carries no
        # slopstopper-cli pin, so install it editable here. This also brings
        # `lizard` (a CLI runtime dependency) used by hygiene:complexity, so the
        # `task ss:*` shims work in the Copilot environment.
        run: pip install -e ./cli

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Same guard as the ss-reliability-* workflows: five minutes per
        # attempt, one retry, and a step timeout over both.
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s 5m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt ${attempt} failed or stalled after 5 minutes"
          done
          echo "::error::Playwright browser install failed twice. Re-run the job; if it keeps failing, check the runner's network."
          exit 1

      # The action and the CLI version it installs move together: Dependabot
      # ignores github/gh-aw (see .github/dependabot.yml), so bump both by hand.
      - name: Install gh-aw extension
        uses: github/gh-aw/actions/setup-cli@9cbca3cd9be433a23a38e4da332635097fd40251 # v0.50.7
        with:
          version: v0.50.7
