name: CI · slopstopper-cli

# Internal CI for the slopstopper-cli Python package under cli/.
# Not part of the distributed slopstopper suite: this workflow is
# slopstopper.dev-internal and is NOT seeded into adopter repos by
# install.sh. Adopters never receive cli/, so they never need to run
# its tests.
#
# One job: the pytest suite under cli/tests/, via cli/Taskfile.yml so
# the exact command developers run locally is what CI runs. As the CLI
# grows beyond pytest (lint, type-check, build, packaging smoke test),
# add task targets in cli/Taskfile.yml and steps here rather than
# spinning up new ss-*-check.yml workflows.
#
# A bash↔CLI "parity" job used to live here too. It diffed each ported
# check against the bash script it replaced; every row was removed as
# the scripts were deleted, and for a while the job kept running an
# empty loop and printing "All parity checks passed." Dead green is
# worse than absent, so it's gone.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'scripts/shot.py'
      - 'scripts/learncheck.py'
      - 'scripts/learntapes.py'
      - 'scripts/learnsite.py'
      - 'docs/learn/**'
      - 'app/learn.html'
      - 'app/learn/**'
      - 'Taskfile.yml'
      - 'Taskfile.ss.yml'
      - '.github/workflows/ci-cli.yml'
      # Every ss-* workflow calls `slopstopper run` / `slopstopper emit`,
      # so a change to any of them needs the CLI tests too.
      - '.github/workflows/ss-*.yml'
      # The shape tests read the composite actions the workflows call.
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'scripts/shot.py'
      - 'scripts/learncheck.py'
      - 'scripts/learntapes.py'
      - 'scripts/learnsite.py'
      - 'docs/learn/**'
      - 'app/learn.html'
      - 'app/learn/**'
      - 'Taskfile.yml'
      - 'Taskfile.ss.yml'
      - '.github/workflows/ci-cli.yml'
      # Every ss-* workflow calls `slopstopper run` / `slopstopper emit`,
      # so a change to any of them needs the CLI tests too.
      - '.github/workflows/ss-*.yml'
      # The shape tests read the composite actions the workflows call.
      - '.github/actions/**'
  workflow_dispatch:
  # The course runs nightly as well as on every push to main, so a CLI
  # change that breaks a lesson is caught within a day even when the PR
  # that made it never touched docs/learn/.
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up toolchain (task)
        # Installs the mise-pinned `task` (mise.toml [tools]), the same
        # version locally and in CI. Replaces a `curl | sh` bootstrap.
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        # test_specs_subpath.py runs the bundled specs in a real browser and
        # skips without this. Composite steps carry no timeout, so the bound
        # over both download attempts sits here.
        uses: ./.github/actions/ss-playwright
        timeout-minutes: 12
      - name: Install Semgrep (test_demo.py's SAST finding)
        # The same pip install as ss-security-sast-check.yml. Lesson 10's
        # ZAP runs from Docker, which the runner already has.
        run: pip install semgrep
      - name: Install Trivy (test_demo.py's dependency finding)
        # The same apt repository as ss-security-vulnerability-all-check.yml.
        run: |
          set -e
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy --version
      - name: Run CLI tests
        run: task -t cli/Taskfile.yml test

  # The site's terminal demo (app/assets/demo.svg) is drawn from real CLI
  # output. Rendering it here proves a change to what a command prints
  # did not break the generator, and the artifact lets a reviewer look
  # at the picture a change produces before anyone re-renders the
  # committed one with `task contributing:shots`.
  shots:
    name: shots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -e ./cli
      - run: python scripts/shot.py --out shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: shots

  # The course under docs/learn/ marks its runnable blocks, and
  # scripts/learncheck.py runs them in order in a sandbox with the CLI
  # from this checkout, so a lesson cannot quietly stop working when a
  # command's output or a task's name changes. The full course takes a
  # quarter of an hour (four ZAP scans, a browser, three scanners), so it
  # runs on a pull request only when the course or its harness changed;
  # every push to main and the nightly schedule run it regardless, and a
  # red there raises the workflow-failure issue. The lessons are split
  # across shards, each installing only the tools its lessons need.
  learn-gate:
    name: learn gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: gate
        shell: bash
        # Context values reach the script through env, never interpolated
        # into it (Semgrep's run-shell-injection rule, and the right habit).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if echo "$changed" | grep -qE '^(docs/learn/|scripts/learncheck\.py|scripts/learntapes\.py|scripts/learnsite\.py|app/learn\.html|app/learn/|\.github/workflows/ci-cli\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The course did not change, so the learn shards are skipped on this pull request; they run on main and nightly."
          fi

  learn:
    name: learn ${{ matrix.name }}
    needs: learn-gate
    if: needs.learn-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "hygiene and agents (0-5, 17-20)"
            pages: "00,01,02,03,04,05,17,18,19,20"
            tools: "vhs"
          - name: "scanners (6-8)"
            pages: "06,07,08"
            tools: "gitleaks semgrep trivy"
          - name: "headers and DAST (9-10)"
            pages: "09,10"
            tools: ""
          - name: "browser (11-16)"
            pages: "11,12,13,14,15,16"
            tools: "playwright"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up toolchain (task)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: pip install -e ./cli
      - name: Install dependencies
        run: npm ci
      - name: Install the browser checks' dependencies (lessons 11 to 16)
        # The same install as the pytest job; the cache and the bounded
        # download live in the action.
        if: contains(matrix.tools, 'playwright')
        uses: ./.github/actions/ss-playwright
        timeout-minutes: 12
      - name: Install Gitleaks (lesson 6)
        # The same pinned release as ss-security-secrets-check.yml.
        if: contains(matrix.tools, 'gitleaks')
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -e
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Install Semgrep (lesson 7)
        # The same pip install as ss-security-sast-check.yml. Lesson 10's
        # ZAP runs from Docker, which the runner already has.
        if: contains(matrix.tools, 'semgrep')
        run: pip install semgrep
      - name: Install Trivy (lesson 8)
        # The same apt repository as ss-security-vulnerability-all-check.yml.
        if: contains(matrix.tools, 'trivy')
        run: |
          set -e
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy --version
      - name: Install vhs (to validate the lesson tapes' syntax)
        if: contains(matrix.tools, 'vhs')
        env:
          VHS_VERSION: "0.10.0"
        run: |
          set -e
          curl -sSfL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp "vhs_${VHS_VERSION}_Linux_x86_64/vhs"
          sudo mv "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
      - name: The lesson tapes match their lessons
        if: contains(matrix.tools, 'vhs')
        run: python scripts/learntapes.py --check
      - name: The lesson pages match their lessons
        run: python scripts/learnsite.py --check
      - run: python scripts/learncheck.py --page "${{ matrix.pages }}"
