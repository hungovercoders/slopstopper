name: CI · slopstopper-cli

# Internal CI for the slopstopper-cli Python package under cli/.
# Not part of the distributed slopstopper suite: this workflow is
# slopstopper.dev-internal and is NOT seeded into adopter repos by
# install.sh. Adopters never receive cli/, so they never need to run
# its tests.
#
# One job: the pytest suite under cli/tests/, via cli/Taskfile.yml so
# the exact command developers run locally is what CI runs. As the CLI
# grows beyond pytest (lint, type-check, build, packaging smoke test),
# add task targets in cli/Taskfile.yml and steps here rather than
# spinning up new ss-*-check.yml workflows.
#
# A bash↔CLI "parity" job used to live here too. It diffed each ported
# check against the bash script it replaced; every row was removed as
# the scripts were deleted, and for a while the job kept running an
# empty loop and printing "All parity checks passed." Dead green is
# worse than absent, so it's gone.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'scripts/shot.py'
      - 'scripts/learncheck.py'
      - 'scripts/learntapes.py'
      - 'docs/learn/**'
      - 'Taskfile.yml'
      - 'Taskfile.ss.yml'
      - '.github/workflows/ci-cli.yml'
      # Every ss-* workflow calls `slopstopper run` / `slopstopper emit`,
      # so a change to any of them needs the CLI tests too.
      - '.github/workflows/ss-*.yml'
  push:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'scripts/shot.py'
      - 'scripts/learncheck.py'
      - 'scripts/learntapes.py'
      - 'docs/learn/**'
      - 'Taskfile.yml'
      - 'Taskfile.ss.yml'
      - '.github/workflows/ci-cli.yml'
      # Every ss-* workflow calls `slopstopper run` / `slopstopper emit`,
      # so a change to any of them needs the CLI tests too.
      - '.github/workflows/ss-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up toolchain (task)
        # Installs the mise-pinned `task` (mise.toml [tools]), the same
        # version locally and in CI. Replaces a `curl | sh` bootstrap.
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Install Playwright
        # test_specs_subpath.py runs the bundled specs in a real browser and
        # skips without this. Each attempt is bounded so a stalled browser
        # download can't hold the job.
        timeout-minutes: 12
        run: |
          npm ci
          for attempt in 1 2; do
            if timeout --kill-after=30s 5m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt ${attempt} failed or stalled after 5 minutes"
          done
          exit 1
      - name: Run CLI tests
        run: task -t cli/Taskfile.yml test

  # The site's terminal demo (app/assets/demo.svg) is drawn from real CLI
  # output. Rendering it here proves a change to what a command prints
  # did not break the generator, and the artifact lets a reviewer look
  # at the picture a change produces before anyone re-renders the
  # committed one with `task contributing:shots`.
  shots:
    name: shots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -e ./cli
      - run: python scripts/shot.py --out shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: shots

  # The course under docs/learn/ marks its runnable blocks, and
  # scripts/learncheck.py runs them in order in a scratch clone with the
  # CLI from this checkout, so a lesson cannot quietly stop working when
  # a command's output or a task's name changes. The hygiene lessons need
  # only the CLI; each lesson that needs an external tool adds its install
  # step here, pinned the way the check's own workflow pins it.
  learn:
    name: learn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up toolchain (task)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: pip install -e ./cli
      - name: Install the browser checks' dependencies (lessons 11 to 13)
        # The same install as the pytest job: npm deps and Playwright's
        # Chromium, bounded so a stalled download fails rather than hangs.
        timeout-minutes: 12
        run: |
          npm ci
          for attempt in 1 2; do
            if timeout --kill-after=30s 5m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt ${attempt} failed or stalled after 5 minutes"
          done
          exit 1
      - name: Install Gitleaks (lesson 6)
        # The same pinned release as ss-security-secrets-check.yml.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -e
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Install Trivy (lesson 8)
        # The same apt repository as ss-security-vulnerability-all-check.yml.
        run: |
          set -e
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy --version
      - name: Install vhs (to validate the lesson tapes' syntax)
        env:
          VHS_VERSION: "0.10.0"
        run: |
          set -e
          curl -sSfL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp "vhs_${VHS_VERSION}_Linux_x86_64/vhs"
          sudo mv "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version
      - name: The lesson tapes match their lessons
        run: python scripts/learntapes.py --check
      - run: python scripts/learncheck.py
