name: SlopStopper · API Headers Check

# Audits the response headers and CORS policy of each endpoint in
# `api.headers.paths`: a wildcard origin sent with credentials, an
# arbitrary Origin reflected back, a missing HSTS or nosniff header. The
# API-shaped analogue of the CSP-exceptions check — on a JSON API, CORS
# is the header that decides who can read the response.
# Triggers: PR, push to main, daily schedule, Cloudflare deployment
# events. Emits a rolling PR comment; workflow fails on a permissive
# policy — no separate main-branch issue (exit code is the signal).
# Docs: docs/security/README.md.
#
# Unlike the browser checks, this workflow never tries to build and serve
# the repo locally: an API is not a static bundle `slopstopper serve` can
# host, and guessing a start command would be worse than not guessing.
# It audits a URL you point it at (urls.preview on PRs, urls.production
# on main/schedule) and skips cleanly when neither is configured.
#
# Note it probes a *live* origin: the CORS assertions depend on the
# headers your edge/proxy actually adds, which a local process often
# doesn't reproduce.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL of the API to audit'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  api-headers:
    name: API response-header + CORS policy audit
    if: |
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up slopstopper
        # Python, the mise-pinned toolchain (task, node, slopstopper-cli) and,
        # in the slopstopper repo only, the CLI from source. One local
        # composite action; install.sh copies it in next to the workflows.
        uses: ./.github/actions/ss-setup

      - name: Determine audit URL
        id: url
        # CUSTOMISE FOR YOUR APP: urls.production / urls.preview in
        # .slopstopper.yml. See .github/actions/ss-resolve-url for the
        # event → URL table.
        uses: ./.github/actions/ss-resolve-url
        with:
          mode: skip
          url: ${{ github.event.inputs.url }}
          deployment-url: ${{ github.event.deployment_status.target_url }}
          check: API Headers Check

      - name: Run API header + CORS audit
        if: steps.url.outputs.skip == 'false'
        id: audit
        run: task ss:security:api-headers -- ${{ steps.url.outputs.url }}

      - name: Upload API headers report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-headers-report-${{ github.run_id }}
          path: .ss/reports/api-headers/
          retention-days: 30
          if-no-files-found: ignore

      - name: Emit PR comment
        if: github.event_name == 'pull_request' && steps.url.outputs.skip == 'false' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:api-headers --target pr-comment --status ${{ steps.audit.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete
