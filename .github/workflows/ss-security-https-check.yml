name: SlopStopper · HTTPS Redirect Check

# Asks the deployed site two questions: does `http://<host>/` redirect to
# `https://` on the same host, and does the https response send
# `Strict-Transport-Security`? A site that answers plain HTTP with a page
# works in a browser that remembers the https URL and fails for a link
# that starts `http://`. Triggers: PR, push to main, daily schedule,
# `deployment_status` events, and a dispatch from ss-cloudflare-deployed.yml
# after a Workers Builds deploy to production. Emits a rolling PR comment. The workflow
# fails on a missing redirect or header. There is no separate main-branch
# issue because the exit code is the signal.
# Docs: docs/security/HTTPS.md.
#
# The redirect and the header come from the edge, which a local build does
# not have, so this workflow never builds and serves the repo. It audits a
# URL you point it at (urls.preview on PRs, urls.production on
# main/schedule) and skips cleanly when neither is configured.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: '48 7 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL of the site to audit'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A new push to a PR cancels the run on the commit it replaced. Every
  # other event gets a group of its own, so nothing on main is cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  https:
    name: HTTP to HTTPS redirect + HSTS audit
    if: |
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up slopstopper
        # Python, the mise-pinned toolchain (task, node, slopstopper-cli) and,
        # in the slopstopper repo only, the CLI from source. One local
        # composite action; install.sh copies it in next to the workflows.
        uses: ./.github/actions/ss-setup

      - name: Determine audit URL
        id: url
        # CUSTOMISE FOR YOUR APP: point urls.preview (.slopstopper.yml) at the
        # environment your PRs deploy to. With no preview environment the PR
        # run skips rather than failing. The deployed-main and scheduled
        # runs still cover the site. See .github/actions/ss-resolve-url.
        uses: ./.github/actions/ss-resolve-url
        with:
          mode: skip
          url: ${{ github.event.inputs.url }}
          deployment-url: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          check: HTTPS Redirect Check

      - name: Run HTTPS redirect + HSTS audit
        if: steps.url.outputs.skip == 'false'
        id: audit
        env:
          TARGET_URL: ${{ steps.url.outputs.url }}
        run: task ss:security:https -- "$TARGET_URL"

      - name: Upload HTTPS report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: https-report-${{ github.run_id }}
          path: .ss/reports/https/
          retention-days: 30
          if-no-files-found: ignore

      - name: Emit PR comment
        if: github.event_name == 'pull_request' && steps.url.outputs.skip == 'false' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:https --target pr-comment --status ${{ steps.audit.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete
