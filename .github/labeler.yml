# Auto-labeling rules for PRs based on changed files — this repo's own.
# Used by: .github/workflows/ss-hygiene-auto-label-pr.yml (actions/labeler v5)
# Adopters get the generic templates/labeler.yml.example from install.sh.
#
# Every ss-* check carries its category in the workflow prefix, the docs
# directory and the check module, so a PR that touches any of the three
# gets the category label. When a check is added or renamed, add its paths
# here (docs/contributing/CHANGE_MAP.md lists this file for that reason).

# ── Documentation ──
docs:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**'
      - '**/*.md'

# ── Security ──
security:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/ss-security-*'
      - 'docs/security/**'
      - 'cli/slopstopper/checks/sast.py'
      - 'cli/slopstopper/checks/dast.py'
      - 'cli/slopstopper/checks/secrets.py'
      - 'cli/slopstopper/checks/vulnerability_all.py'
      - 'cli/slopstopper/checks/api_headers.py'
      - 'worker/headers.json'

# ── Reliability ──
reliability:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/ss-reliability-*'
      - 'docs/reliability/**'
      - 'cli/slopstopper/checks/smoke.py'
      - 'cli/slopstopper/checks/accessibility.py'
      - 'cli/slopstopper/checks/broken_links.py'
      - 'cli/slopstopper/checks/cwv.py'
      - 'cli/slopstopper/checks/seo.py'
      - 'cli/slopstopper/checks/llms_txt.py'
      - 'cli/slopstopper/checks/robots_txt.py'
      - 'cli/slopstopper/checks/sitemap.py'
      - 'cli/slopstopper/checks/api_health.py'
      - 'cli/slopstopper/checks/api_latency.py'
      - 'cli/slopstopper/checks/_playwright.py'
      - 'cli/slopstopper/data/tests/**'
      - 'cli/slopstopper/data/playwright.config.js'
      - 'cli/slopstopper/data/lighthouserc*.json'

# ── Hygiene ──
hygiene:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/ss-hygiene-*'
      - '.github/labeler.yml'
      - 'docs/hygiene/**'
      - 'cli/slopstopper/checks/complexity.py'
      - 'cli/slopstopper/checks/csp_exceptions.py'
      - 'cli/slopstopper/checks/docs_accuracy.py'
      - 'cli/slopstopper/checks/docs_size.py'
      - 'cli/slopstopper/checks/docs_structure.py'
      - 'cli/slopstopper/checks/entry_files.py'
      - 'cli/slopstopper/checks/openapi.py'
      - 'cli/slopstopper/checks/_routes.py'
      - 'cli/slopstopper/data/templates/entry-files/**'

# ── CLI package ──
cli:
  - changed-files:
    - any-glob-to-any-file:
      - 'cli/**'

# ── Tests ──
tests:
  - changed-files:
    - any-glob-to-any-file:
      - 'cli/tests/**'
      - 'cli/slopstopper/data/tests/**'

# ── Installer, task shims, toolchain pin ──
installer:
  - changed-files:
    - any-glob-to-any-file:
      - 'install.sh'
      - 'install-skill.sh'
      - 'templates/**'
      - 'Taskfile.yml'
      - 'Taskfile.ss.yml'
      - 'mise.toml'
      - '.slopstopper.yml.example'
      - 'cli/slopstopper/data/profiles.json'

# ── Claude Code skills shipped to adopters ──
skills:
  - changed-files:
    - any-glob-to-any-file:
      - '.claude/skills/**'

# ── Deployment / Infrastructure ──
deployment:
  - changed-files:
    - any-glob-to-any-file:
      - 'wrangler.jsonc'
      - 'worker/**'
      - 'docs/deployment/**'

# ── CI/CD ──
ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

# ── The site under app/ ──
content:
  - changed-files:
    - any-glob-to-any-file:
      - 'app/**'
