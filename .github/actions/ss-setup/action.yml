name: Set up slopstopper
description: >-
  Python, the mise-pinned toolchain (task, node and — in adopter repos — the
  pinned slopstopper-cli), and in the slopstopper repo itself the CLI from
  source. Every ss-* workflow starts with this step.

# One local composite action rather than the same three steps copied into
# every workflow. `uses: ./.github/actions/ss-setup` needs no publishing and
# no versioning: install.sh copies this directory into adopter repos next to
# the workflows, so everything a workflow does is still visible and diffable
# in the adopter's own tree.
#
# The workflow must have checked out the repo before this runs — a local
# action is resolved from the checkout.

inputs:
  python-version:
    description: Python to put on PATH (mise's pipx backend needs one)
    required: false
    default: '3.11'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up the mise-pinned toolchain
      # Installs task, node and (in adopter repos) the pinned slopstopper-cli
      # from mise.toml and puts them on PATH for later steps. The pins live in
      # mise.toml ([tools]); mise resolves them per-repo, so CI and local runs
      # share one version.
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

    - name: Install slopstopper-cli from source (slopstopper.dev only)
      # In the slopstopper repo the CLI runs from source (HEAD), so mise.toml
      # carries no slopstopper-cli pin — install it editable here. Adopter
      # repos skip this (no cli/ source) and use the mise-pinned wheel.
      if: ${{ hashFiles('cli/pyproject.toml') != '' }}
      shell: bash
      run: pip install -e ./cli
