# Root Taskfile for slopstopper itself.
#
# Two task surfaces live here:
#   1. `task ss:*` — the adopter-facing quality suite, included from
#      ./Taskfile.ss.yml. This is what gets shipped to adopter repos
#      by install.sh.
#   2. `task contributing:*` and `task decisions:*` — slopstopper-internal
#      tooling for working on the site/CLI/governance. These are NOT
#      shipped to adopters. Every target here does real work in THIS repo
#      — nothing degrades to an "ℹ️ nothing to do" echo.
#
# See `task --list-all` for the full surface.

version: '3'

includes:
  ss:
    taskfile: ./Taskfile.ss.yml
  # The CLI package's own Taskfile (pytest loop). Included as internal so
  # `contributing:test` can delegate to it without a second public namespace
  # — invoke it directly with `task -t cli/Taskfile.yml test` if you prefer.
  cli:
    taskfile: ./cli/Taskfile.yml
    dir: ./cli
    internal: true

vars:
  # Where `contributing:run` serves app/ and where `contributing:test:site`
  # points the browser checks. Override with SITE_URL=… on the command line.
  SITE_URL: '{{.SITE_URL | default "http://localhost:8080"}}'

tasks:
  # ───────────── Contributing — slopstopper's own dev loop ─────────────

  contributing:setup:
    desc: Install npm + CLI dev dependencies and wire the pre-push hygiene hook
    cmds:
      - npm install
      - pip install -e ./cli
      - task: contributing:hooks-install

  contributing:hooks-install:
    desc: Point git at .githooks so the pre-push hygiene gate runs locally
    cmds:
      - git config core.hooksPath .githooks
      - echo "✅ core.hooksPath → .githooks (pre-push runs task ss:hygiene:test)"

  contributing:assets:
    desc: Re-render SVG source assets (og-image, apple-touch-icon) to PNG via Playwright
    cmds:
      - node scripts/render-static-assets.js

  contributing:lint:
    desc: markdownlint over docs/ and CONTRIBUTING.md (advisory — not a CI gate)
    cmds:
      - npx markdownlint 'docs/**/*.md' CONTRIBUTING.md {{.CLI_ARGS}}

  contributing:run:
    desc: Serve app/ locally on :8080 via `slopstopper serve` (PORT=… to change)
    cmds:
      - slopstopper serve

  contributing:test:
    desc: Run the CLI's pytest suite (cli/tests) — pass `-- -k <expr>` to filter
    cmds:
      - task: cli:test

  contributing:test:site:
    desc: Browser checks (smoke + accessibility) against SITE_URL (default :8080 — run contributing:run first)
    cmds:
      - task: ss:reliability:smoke
        vars: { CLI_ARGS: '--url {{.SITE_URL}}' }
      - task: ss:reliability:accessibility
        vars: { CLI_ARGS: '--url {{.SITE_URL}}' }

  # ───────────── Decisions — slopstopper's ADR governance ─────────────
  #
  # docs/decisions/README.md is the single decisions file: it carries the
  # log table AND the note template inline. Supporting notes are optional
  # siblings named <date>-<slug>.md.

  decisions:validate:
    silent: true
    desc: Validate docs/decisions/README.md carries the log table + the note template
    cmds:
      - |
        f=docs/decisions/README.md
        if [ ! -f "$f" ]; then
          echo "❌ $f not found"
          exit 1
        fi
        if ! grep -q "| Date | Decision | Status | Rationale | Notes |" "$f"; then
          echo "❌ $f is missing the decisions table header"
          exit 1
        fi
        if ! grep -q "^# Decision Template" "$f"; then
          echo "❌ $f is missing the '# Decision Template' section"
          exit 1
        fi
        echo "✅ Decisions documentation baseline is valid"

  decisions:new:
    silent: true
    desc: Create docs/decisions/<date>-<slug>.md from the template in README.md (use SLUG=<name>)
    vars:
      DATE:
        sh: date +%F
    cmds:
      - |
        if [ -z "{{.SLUG}}" ]; then
          echo "❌ Missing SLUG. Usage: task decisions:new SLUG=<decision-name>"
          exit 1
        fi
        target="docs/decisions/{{.DATE}}-{{.SLUG}}.md"
        if [ -f "$target" ]; then
          echo "❌ $target already exists"
          exit 1
        fi
        # Copy everything from the '# Decision Template' heading to EOF,
        # retitling it after the slug and stamping today's date.
        awk '/^# Decision Template/{p=1} p' docs/decisions/README.md \
          | sed -e '1s/.*/# Decision: {{.SLUG}}/' -e 's/^- Date: YYYY-MM-DD/- Date: {{.DATE}}/' \
          > "$target"
        echo "✅ Created $target — now add a row to the log table in docs/decisions/README.md"
