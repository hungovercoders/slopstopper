<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern: service status</title>
  <meta name="description" content="Which services exist, who owns each one, and where to look when one is down.">
  <link rel="canonical" href="https://lantern.example.com/">
  <link rel="stylesheet" href="style.css">
  <meta property="og:title" content="Lantern: service status">
  <meta property="og:description" content="Which services exist, who owns each one, and where to look when one is down.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lantern.example.com/">
  <meta property="og:image" content="/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lantern: service status">
  <meta name="twitter:description" content="Which services exist, who owns each one, and where to look when one is down.">
  <meta name="twitter:image" content="/og-image.svg">
</head>
<body>
  <header>
    <h1>Lantern</h1>
    <p>Which services exist, who owns each one, and where to look when one is down.</p>
  </header>
  <main>
    <article>
      <h2>gateway</h2>
      <p>Owner: platform. Status: <span class="status ok">ok</span>.</p>
      <p><a href="https://example.com/runbooks/gateway">Runbook</a></p>
    </article>
    <article>
      <h2>billing</h2>
      <p>Owner: payments. Status: <span class="status ok">ok</span>.</p>
      <p><a href="https://example.com/runbooks/billing">Runbook</a></p>
    </article>
    <article>
      <h2>search</h2>
      <p>Owner: discover. Status: <span class="status unknown">unknown</span>.</p>
      <p><a href="https://example.com/runbooks/search">Runbook</a></p>
    </article>
  </main>
  <footer>
    <p>Served as static files; the page is the whole app.</p>
  </footer>
</body>
</html>
