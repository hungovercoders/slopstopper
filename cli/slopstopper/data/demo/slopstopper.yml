# .slopstopper.yml for the Lantern demo repo, which `slopstopper demo`
# writes. The keys most repos set; every other knob has a default and is
# documented in the schema reference:
#   https://github.com/hungovercoders/slopstopper/blob/main/.slopstopper.yml.example

# A site that serves HTML: every check applies.
profile: ui

urls:
  production:
  preview:

# The status page and the incident history.
pages:
  smoke:         /,/history.html
  e2e:           /
  accessibility: /,/history.html
  seo:           /,/history.html
  broken_links:  /,/history.html

# The share image is an SVG, and the smoke test's share-image assertion
# wants a PNG, so that one assertion is off. The SEO check still fetches
# the image the page names.
smoke:
  og_image_path: ''

# The host's headers file; the CSP-drift check reads it against
# docs/security/CSP_EXCEPTIONS.md.
headers:
  source: app/_headers
  format: cloudflare-text

workflows:
  disabled: []
  enabled: []
